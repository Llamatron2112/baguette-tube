# config/packages/knp_paginator.yaml
knp_paginator:
    page_range: 5                        # number of pages shown in the pagination
    default_options:
        page_name: page                  # query parameter name for the page
        sort_field_name: sort            # query parameter name for the sort field
        sort_direction_name: direction   # query parameter name for the sort direction
        distinct: true                   # set to false for complex queries / performance
        filter_field_name: filterField
        filter_value_name: filterValue
    template:
        pagination: 'pagination/sliding.html.twig'
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'
        filtration: '@KnpPaginator/Pagination/filtration.html.twig'
